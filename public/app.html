<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Wather — Adaptive Intelligence (Beta)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" id="highlight-theme" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-surface: #f8faf8;
      --bg-sidebar: #eff3ef;
      --bg-card: #ffffff;
      --bg-input: #ffffff;
      --border: #dbe3db;
      --border-focus: #10b981;
      --primary: #059669;
      --primary-hover: #047857;
      --primary-soft: #ecfdf5;
      --text-main: #132a1c;
      --text-muted: #52796f;
      --shadow: 0 4px 20px -2px rgba(19, 42, 28, 0.05);
      --code-bg: #f2f5f2;
    }

    [data-theme="dark"] {
      --bg-surface: #0c1410;
      --bg-sidebar: #080d0a;
      --bg-card: #131e18;
      --bg-input: #131e18;
      --border: #1f3329;
      --border-focus: #10b981;
      --primary: #10b981;
      --primary-hover: #34d399;
      --primary-soft: rgba(16, 185, 129, 0.1);
      --text-main: #e8f5ee;
      --text-muted: #82a392;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
      --code-bg: #070c09;
    }

    @media (prefers-color-scheme: dark) {
      [data-theme="system"] {
        --bg-surface: #0c1410;
        --bg-sidebar: #080d0a;
        --bg-card: #131e18;
        --bg-input: #131e18;
        --border: #1f3329;
        --border-focus: #10b981;
        --primary: #10b981;
        --primary-hover: #34d399;
        --primary-soft: rgba(16, 185, 129, 0.1);
        --text-main: #e8f5ee;
        --text-muted: #82a392;
        --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
        --code-bg: #070c09;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.2s, border-color 0.2s; }

    body {
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      z-index: 40;
    }

    aside {
      width: 270px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 14px;
      z-index: 50;
      flex-shrink: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-leaf {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #10b981, #047857);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }

    .brand-name {
      font-weight: 700;
      font-size: 1.15rem;
    }

    .close-sidebar-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px;
    }

    .new-chat-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .new-chat-btn:hover { border-color: var(--primary); }

    .sidebar-history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
    }

    .history-item {
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      border: 1px solid transparent;
    }

    .history-item.active {
      background: var(--bg-card);
      color: var(--primary);
      font-weight: 600;
      border-color: var(--border);
    }

    .history-item:hover:not(.active) {
      background: var(--bg-card);
      color: var(--text-main);
    }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 6px;
    }

    .history-actions {
      display: none;
      gap: 6px;
      align-items: center;
    }

    .history-item:hover .history-actions {
      display: flex;
    }

    .action-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
    }

    .action-icon:hover {
      color: var(--text-main);
      background: var(--primary-soft);
    }

    .action-icon.delete:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    .user-dock {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
    }

    .user-info {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
      font-weight: 600;
    }

    .logout-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
    }

    .logout-btn:hover { color: #ef4444; }

    .theme-dock {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 2px;
    }

    .theme-btn {
      background: transparent;
      border: none;
      padding: 6px 0;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
    }

    .theme-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
      min-width: 0;
    }

    header {
      height: 58px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg-surface);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle-btn {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      width: 36px;
      height: 36px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    .menu-toggle-btn svg { width: 18px; height: 18px; fill: currentColor; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .credits-badge {
      font-size: 0.78rem;
      font-weight: 700;
      color: #eab308;
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid rgba(234, 179, 8, 0.3);
      padding: 4px 12px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-badge {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .beta-indicator {
      background: rgba(234, 179, 8, 0.25);
      color: #eab308;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      scroll-behavior: smooth;
    }

    .chat-container {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .avatar.user { background: var(--text-muted); color: var(--bg-surface); }
    .avatar.wather { background: linear-gradient(135deg, #10b981, #047857); color: #fff; }

    .content-block {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      overflow-wrap: break-word;
      min-width: 0;
    }

    .content-block p { margin-bottom: 12px; }
    .content-block p:last-child { margin-bottom: 0; }

    pre {
      margin: 14px 0;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--code-bg) !important;
      border: 1px solid var(--border);
      overflow-x: auto;
      position: relative;
    }

    code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 0.72rem;
      padding: 4px 8px;
      cursor: pointer;
    }

    .copy-btn:hover { color: var(--text-main); }

    .dock-wrapper {
      padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, transparent 0%, var(--bg-surface) 40%);
      flex-shrink: 0;
    }

    .dock {
      max-width: 820px;
      margin: 0 auto;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--shadow);
    }

    .dock:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px var(--primary-soft);
    }

    .dock textarea {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.45;
      outline: none;
      resize: none;
      height: 44px;
      max-height: 160px;
    }

    .dock-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dock-hint { font-size: 0.72rem; color: var(--text-muted); }

    .send-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
      flex-shrink: 0;
    }

    .send-icon-btn.stop {
      background: #ef4444;
    }

    .send-icon-btn svg { width: 16px; height: 16px; fill: currentColor; }

    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .auth-overlay.show {
      display: flex !important;
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-title { font-weight: 700; font-size: 1.25rem; text-align: center; }
    .auth-subtitle { font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-top: -6px; }

    .social-btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .social-btn:hover { border-color: var(--primary); }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin: 2px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider span { padding: 0 8px; }

    .auth-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    .auth-input:focus { border-color: var(--primary); }

    .primary-auth-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .primary-auth-btn:hover { background: var(--primary-hover); }

    .auth-toggle {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .auth-toggle strong { color: var(--primary); }

    @media (max-width: 768px) {
      aside {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 280px;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 4px 0 25px rgba(0, 0, 0, 0.25);
      }

      aside.open {
        transform: translateX(0);
      }

      .sidebar-backdrop.active {
        display: block;
      }

      .menu-toggle-btn {
        display: flex;
      }

      .close-sidebar-btn {
        display: block;
      }

      .dock-hint {
        display: none;
      }

      .history-actions {
        display: flex;
      }

      .chat-scroll {
        padding: 16px 12px;
      }

      header {
        padding: 0 14px;
      }
    }
  </style>
</head>
<body>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="auth-overlay" id="authModal">
    <div class="auth-card">
      <div class="auth-title" id="authTitleText">Trial Credits Exhausted</div>
      <div class="auth-subtitle" id="authSubText">Sign in or create an account to unlock unlimited access</div>

      <button class="social-btn" id="googleBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Continue with Google
      </button>

      <button class="social-btn" id="facebookBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Continue with Facebook
      </button>

      <div class="divider"><span>OR EMAIL</span></div>

      <input type="email" id="authEmail" class="auth-input" placeholder="name@example.com" />
      <input type="password" id="authPassword" class="auth-input" placeholder="Password" />
      
      <button class="primary-auth-btn" id="submitAuthBtn" type="button">Sign In</button>
      <div class="auth-toggle" id="authToggleText">Don't have an account? <strong>Sign Up</strong></div>
    </div>
  </div>

  <aside id="sidebar">
    <div class="brand-row">
      <a href="index.html" class="brand-group">
        <div class="brand-leaf">W</div>
        <div class="brand-name">Wather</div>
      </a>
      <button class="close-sidebar-btn" id="closeSidebarBtn">✕</button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <span>+</span> New Session
    </button>

    <div class="sidebar-history" id="historyList"></div>

    <div class="user-dock">
      <div class="user-info" id="userDisplay">Trial Account</div>
      <button class="logout-btn" id="logoutBtn">Sign In</button>
    </div>

    <div class="theme-dock">
      <button class="theme-btn" data-set-theme="light">Light</button>
      <button class="theme-btn" data-set-theme="dark">Dark</button>
      <button class="theme-btn active" data-set-theme="system">System</button>
    </div>
  </aside>

  <main>
    <header>
      <div class="header-left">
        <button class="menu-toggle-btn" id="menuToggleBtn" title="Toggle Menu">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <div class="status-badge">
          ● Engine Online <span class="beta-indicator">BETA</span>
        </div>
      </div>
      <div class="header-right">
        <div class="credits-badge" id="creditsBadge">⚡ 100 Credits</div>
      </div>
    </header>

    <div class="chat-scroll" id="scrollBox">
      <div class="chat-container" id="chatContainer"></div>
    </div>

    <div class="dock-wrapper">
      <div class="dock">
        <textarea id="promptInput" placeholder="Message Wather... (20 credits/query)"></textarea>
        <div class="dock-actions">
          <span class="dock-hint">Shift + Enter for new line</span>
          <button class="send-icon-btn" id="sendBtn" title="Send message">
            <svg id="sendIcon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const SUPABASE_URL = 'https://cjcubytqqtkysddehscg.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqY3VieXRxcXRreXNkZGVoc2NnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NTkwMDcsImV4cCI6MjEwNTEzNTAwN30.ee_hLF9tLEiTtzJuvkGpE_xYcGmloJOB7k9tNSL6jNM';

      const supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      let isSignUpMode = false;
      let currentUser = null;
      let abortController = null;
      let isGenerating = false;

      let credits = parseInt(localStorage.getItem('wather-trial-credits') ?? '100', 10);
      if (isNaN(credits)) credits = 100;

      const creditsBadge = document.getElementById('creditsBadge');
      const authModal = document.getElementById('authModal');
      const userDisplay = document.getElementById('userDisplay');
      const submitBtn = document.getElementById('submitAuthBtn');
      const authToggle = document.getElementById('authToggleText');
      const googleBtn = document.getElementById('googleBtn');
      const facebookBtn = document.getElementById('facebookBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const chatContainer = document.getElementById('chatContainer');
      const scrollBox = document.getElementById('scrollBox');
      const promptInput = document.getElementById('promptInput');
      const sendBtn = document.getElementById('sendBtn');
      const sendIcon = document.getElementById('sendIcon');
      const newChatBtn = document.getElementById('newChatBtn');
      const historyList = document.getElementById('historyList');

      function updateCreditsDisplay() {
        if (currentUser) {
          creditsBadge.innerText = '⚡ Unlimited (Beta)';
          creditsBadge.style.color = 'var(--primary)';
          creditsBadge.style.background = 'var(--primary-soft)';
          creditsBadge.style.borderColor = 'var(--primary)';
        } else {
          creditsBadge.innerText = `⚡ ${credits} Credits`;
          if (credits <= 20) {
            creditsBadge.style.color = '#ef4444';
            creditsBadge.style.background = 'rgba(239, 68, 68, 0.12)';
            creditsBadge.style.borderColor = 'rgba(239, 68, 68, 0.3)';
          } else {
            creditsBadge.style.color = '#eab308';
            creditsBadge.style.background = 'rgba(234, 179, 8, 0.12)';
            creditsBadge.style.borderColor = 'rgba(234, 179, 8, 0.3)';
          }
        }
      }
      updateCreditsDisplay();

      const sidebar = document.getElementById('sidebar');
      const sidebarBackdrop = document.getElementById('sidebarBackdrop');
      const menuToggleBtn = document.getElementById('menuToggleBtn');
      const closeSidebarBtn = document.getElementById('closeSidebarBtn');

      function toggleSidebar(open) {
        if (open) {
          sidebar.classList.add('open');
          sidebarBackdrop.classList.add('active');
        } else {
          sidebar.classList.remove('open');
          sidebarBackdrop.classList.remove('active');
        }
      }

      menuToggleBtn.addEventListener('click', () => toggleSidebar(true));
      closeSidebarBtn.addEventListener('click', () => toggleSidebar(false));
      sidebarBackdrop.addEventListener('click', () => toggleSidebar(false));

      function getStorageKey() {
        return currentUser ? `wather-sessions-${currentUser.id}` : 'wather-sessions-trial';
      }

      function getActiveKey() {
        return currentUser ? `wather-active-${currentUser.id}` : 'wather-active-trial';
      }

      let sessions = [];
      let currentSessionId = null;

      function loadUserSessions() {
        sessions = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
        currentSessionId = localStorage.getItem(getActiveKey()) || null;
        if (sessions.length === 0) {
          createNewSession();
        } else {
          if (!currentSessionId || !sessions.some(s => s.id === currentSessionId)) {
            currentSessionId = sessions[0].id;
          }
          saveSessions();
          renderChat();
        }
      }

      function saveSessions() {
        localStorage.setItem(getStorageKey(), JSON.stringify(sessions));
        localStorage.setItem(getActiveKey(), currentSessionId);
        renderSidebar();
      }

      function createNewSession() {
        if (isGenerating) stopGeneration();
        const id = 'sess_' + Date.now();
        sessions.unshift({ id: id, title: 'New Conversation', messages: [] });
        currentSessionId = id;
        saveSessions();
        renderChat();
        if (window.innerWidth <= 768) toggleSidebar(false);
      }

      function renderSidebar() {
        historyList.innerHTML = '';
        sessions.forEach(sess => {
          const item = document.createElement('div');
          item.className = `history-item ${sess.id === currentSessionId ? 'active' : ''}`;
          
          const title = document.createElement('span');
          title.className = 'history-title';
          title.innerText = sess.title;
          title.addEventListener('click', () => {
            if (isGenerating) return;
            currentSessionId = sess.id;
            saveSessions();
            renderChat();
            if (window.innerWidth <= 768) toggleSidebar(false);
          });

          const actions = document.createElement('div');
          actions.className = 'history-actions';

          const editBtn = document.createElement('button');
          editBtn.className = 'action-icon';
          editBtn.title = 'Rename';
          editBtn.innerHTML = '✏️';
          editBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const newTitle = prompt('Enter conversation name:', sess.title);
            if (newTitle && newTitle.trim()) {
              sess.title = newTitle.trim();
              saveSessions();
            }
          });

          const delBtn = document.createElement('button');
          delBtn.className = 'action-icon delete';
          delBtn.title = 'Delete';
          delBtn.innerHTML = '🗑️';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm('Delete this chat session?')) {
              sessions = sessions.filter(s => s.id !== sess.id);
              if (currentSessionId === sess.id) {
                currentSessionId = sessions.length > 0 ? sessions[0].id : null;
              }
              if (sessions.length === 0) createNewSession();
              else {
                saveSessions();
                renderChat();
              }
            }
          });

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);

          item.appendChild(title);
          item.appendChild(actions);
          historyList.appendChild(item);
        });
      }

      authToggle.addEventListener('click', () => {
        isSignUpMode = !isSignUpMode;
        submitBtn.innerText = isSignUpMode ? 'Create Account' : 'Sign In';
        authToggle.innerHTML = isSignUpMode 
          ? 'Already have an account? <strong>Sign In</strong>' 
          : "Don't have an account? <strong>Sign Up</strong>";
      });

      submitBtn.addEventListener('click', async () => {
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value.trim();
        if (!email || !password) return alert('Please enter both email and password.');

        submitBtn.innerText = 'Processing...';
        submitBtn.disabled = true;

        try {
          if (isSignUpMode) {
            const { error } = await supaClient.auth.signUp({ email, password });
            if (error) alert('Signup Error: ' + error.message);
            else {
              alert('Account registered! Logging in...');
              await supaClient.auth.signInWithPassword({ email, password });
            }
          } else {
            const { error } = await supaClient.auth.signInWithPassword({ email, password });
            if (error) alert('Login Error: ' + error.message);
          }
        } catch (err) {
          alert('Error: ' + err.message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = isSignUpMode ? 'Create Account' : 'Sign In';
        }
      });

      googleBtn.addEventListener('click', async () => {
        const { error } = await supaClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + window.location.pathname }
        });
        if (error) alert('Google OAuth Error: ' + error.message);
      });

      facebookBtn.addEventListener('click', async () => {
        const { error } = await supaClient.auth.signInWithOAuth({
          provider: 'facebook',
          options: { redirectTo: window.location.origin + window.location.pathname }
        });
        if (error) alert('Facebook OAuth Error: ' + error.message);
      });

      logoutBtn.addEventListener('click', async () => {
        if (!currentUser) {
          authModal.classList.add('show');
          return;
        }
        if (isGenerating) stopGeneration();
        await supaClient.auth.signOut();
        window.location.reload();
      });

      supaClient.auth.onAuthStateChange((event, session) => {
        if (session?.user) {
          currentUser = session.user;
          authModal.classList.remove('show');
          userDisplay.innerText = currentUser.email || 'User';
          logoutBtn.innerText = 'Log out';
          updateCreditsDisplay();
          loadUserSessions();
        } else {
          currentUser = null;
          userDisplay.innerText = 'Trial Account';
          logoutBtn.innerText = 'Sign In';
          updateCreditsDisplay();
          loadUserSessions();
        }
      });

      function updateButtonState(generating) {
        isGenerating = generating;
        if (generating) {
          sendBtn.classList.add('stop');
          sendBtn.title = 'Stop generating';
          sendIcon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2" fill="white"/>';
        } else {
          sendBtn.classList.remove('stop');
          sendBtn.title = 'Send message';
          sendIcon.innerHTML = '<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>';
        }
      }

      function stopGeneration() {
        if (abortController) {
          abortController.abort();
          abortController = null;
        }
        updateButtonState(false);
      }

      function renderChat() {
        chatContainer.innerHTML = '';
        const current = sessions.find(s => s.id === currentSessionId);
        if (!current || current.messages.length === 0) {
          appendRow('wather', 'I am **Wather (Beta v0.9)**. You have **100 trial credits** (20 credits per query). Ask me any technical, architectural, or coding question!');
          return;
        }
        current.messages.forEach(m => appendRow(m.role, m.content));
      }

      function attachCodeCopyButtons() {
        document.querySelectorAll('pre').forEach(pre => {
          if (pre.querySelector('.copy-btn')) return;
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.innerText = 'Copy';
          btn.onclick = () => {
            navigator.clipboard.writeText(pre.querySelector('code')?.innerText || '');
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = 'Copy', 1500);
          };
          pre.appendChild(btn);
        });
      }

      marked.setOptions({
        highlight: (code, lang) => hljs.getLanguage(lang) ? hljs.highlight(code, { language: lang }).value : hljs.highlightAuto(code).value
      });

      // CLOUD AI STREAMING ENGINE (RENDER + GEMINI)
      async function streamLiveAI(messages, onChunk, signal) {
        const CLOUD_API_URL = 'https://wather-ai.onrender.com/api/chat';

        try {
          const res = await fetch(CLOUD_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages }),
            signal: signal
          });

          if (!res.ok) throw new Error(`Cloud API error: ${res.status}`);

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || trimmed === 'data: [DONE]') continue;
              if (trimmed.startsWith('data: ')) {
                try {
                  const data = JSON.parse(trimmed.slice(6));
                  if (data.text) {
                    onChunk(data.text);
                  }
                } catch (e) {}
              }
            }
          }
        } catch (err) {
          if (err.name === 'AbortError') throw err;

          const fallback = "Connecting to the cloud engine... If the server was idle, the first response can take ~30 seconds to spin up. Please submit your prompt again in a moment!";
          onChunk(fallback);
        }
      }

      async function send() {
        if (isGenerating) {
          stopGeneration();
          return;
        }

        const text = promptInput.value.trim();
        if (!text) return;

        // CREDIT GATE
        if (!currentUser) {
          if (credits < 20) {
            document.getElementById('authTitleText').innerText = "Trial Complete (0 Credits)";
            document.getElementById('authSubText').innerText = "You have used all 100 free credits. Sign in with Google or create an account to unlock unlimited access!";
            authModal.classList.add('show');
            return;
          }
          credits -= 20;
          localStorage.setItem('wather-trial-credits', credits.toString());
          updateCreditsDisplay();
        }

        const current = sessions.find(s => s.id === currentSessionId);
        if (!current) return;

        updateButtonState(true);
        abortController = new AbortController();

        promptInput.value = '';
        promptInput.style.height = '44px';

        if (current.messages.length === 0) {
          current.title = text.slice(0, 24) + (text.length > 24 ? '...' : '');
        }

        current.messages.push({ role: 'user', content: text });
        appendRow('user', text);
        saveSessions();

        const botContentEl = appendRow('wather', '');
        let fullResponse = '';

        try {
          await streamLiveAI(
            current.messages,
            (chunk) => {
              fullResponse += chunk;
              botContentEl.innerHTML = marked.parse(fullResponse);
              hljs.highlightAll();
              attachCodeCopyButtons();
              scrollBox.scrollTop = scrollBox.scrollHeight;
            },
            abortController.signal
          );

          current.messages.push({ role: 'assistant', content: fullResponse });
          saveSessions();
        } catch (err) {
          if (err.name === 'AbortError') {
            botContentEl.innerHTML += '<br><em style="color:var(--text-muted);font-size:0.8rem;">(Response stopped)</em>';
            if (fullResponse) {
              current.messages.push({ role: 'assistant', content: fullResponse + ' *(stopped)*' });
              saveSessions();
            }
          }
        } finally {
          updateButtonState(false);
          abortController = null;

          if (!currentUser && credits <= 0) {
            setTimeout(() => {
              document.getElementById('authTitleText').innerText = "Trial Complete (0 Credits)";
              document.getElementById('authSubText').innerText = "You have used all 100 free credits. Sign in with Google or create an account to unlock unlimited access!";
              authModal.classList.add('show');
            }, 700);
          }
        }
      }

      function appendRow(role, text) {
        const row = document.createElement('div');
        row.className = 'message-row';
        const avatar = document.createElement('div');
        avatar.className = `avatar ${role}`;
        avatar.innerText = role === 'user' ? 'U' : 'W';
        const content = document.createElement('div');
        content.className = 'content-block';
        content.innerHTML = text ? marked.parse(text) : '...';
        row.appendChild(avatar);
        row.appendChild(content);
        chatContainer.appendChild(row);
        attachCodeCopyButtons();
        scrollBox.scrollTop = scrollBox.scrollHeight;
        return content;
      }

      sendBtn.addEventListener('click', send);
      promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      promptInput.addEventListener('input', () => {
        promptInput.style.height = 'auto';
        promptInput.style.height = `${Math.min(promptInput.scrollHeight, 160)}px`;
      });

      newChatBtn.addEventListener('click', () => {
        createNewSession();
      });

      const themeButtons = document.querySelectorAll('[data-set-theme]');
      const highlightLink = document.getElementById('highlight-theme');

      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('wather-theme', theme);
        themeButtons.forEach(b => b.classList.toggle('active', b.getAttribute('data-set-theme') === theme));
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
        highlightLink.href = isDark 
          ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css'
          : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
      }

      themeButtons.forEach(btn => btn.addEventListener('click', () => setTheme(btn.getAttribute('data-set-theme'))));
      setTheme(localStorage.getItem('wather-theme') || 'system');
    })();
  </script>
</body>
